name: Render pilot heartbeat

on:
  schedule:
    # Ten-minute spacing leaves a buffer before Render's 15-minute idle timeout.
    # Avoid minute zero, when GitHub scheduled workflows are busiest.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the public app shell
        run: |
          curl --fail --silent --show-error --location \
            --max-time 95 --retry 2 --retry-delay 5 \
            --header 'Cache-Control: no-cache' \
            --output /dev/null \
            'https://sistema-marcos-piloto.onrender.com/'
